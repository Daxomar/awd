<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Accra We Dey Admin</title>
<link rel="stylesheet" href="/admin/app.css">
</head>
<body>
<header class="top">
  <div class="brand">Accra We Dey <span>Admin</span></div>
  <div id="who" class="who" hidden></div>
</header>
<main id="app">
  <section id="signin" class="signin" hidden>
    <h1>Staff sign-in</h1>
    <p class="muted">Use your game account. Only accounts with an administrator role can sign in here; sessions end after 30 idle minutes.</p>
    <form id="signinForm" autocomplete="on">
      <label>Username <input id="user" name="username" autocomplete="username" required maxlength="16"></label>
      <label>Password <input id="pass" name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
      <button class="btn" type="submit">Sign in</button>
      <p id="signinMsg" class="msg" role="alert"></p>
    </form>
  </section>
  <section id="shell" hidden>
    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
    <div id="view" class="view" tabindex="-1"></div>
  </section>
</main>
<dialog id="confirm" class="confirm">
  <form method="dialog" id="confirmForm">
    <h2 id="cTitle"></h2>
    <p id="cText" class="muted"></p>
    <div id="cFields"></div>
    <p id="cMsg" class="msg" role="alert"></p>
    <div class="row end"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" id="cGo" value="go">Confirm</button></div>
  </form>
</dialog>
<script type="module" src="/admin/app.js"></script>
</body>
</html>
