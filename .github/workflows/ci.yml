name: Test and build containers
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      integration-db:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: awd
          POSTGRES_PASSWORD: disposable-ci-database-only
          POSTGRES_DB: awd_security
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U awd -d awd_security"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm audit --omit=dev
        working-directory: server
      - name: Verify payment, advertising, social and milestone transactions
        working-directory: server
        env:
          DATABASE_URL: postgres://awd:disposable-ci-database-only@127.0.0.1:5432/awd_security
        run: |
          node loadtest/payments-integration.js
          node loadtest/ads-integration.js
          node loadtest/first-friend-integration.js
          node loadtest/objectives-integration.js
          node loadtest/life-integration.js
          NODE_ENV=test BIRTH_SEED=ci-disposable-seed node loadtest/property-db.test.js
          NODE_ENV=test BIRTH_SEED=ci-disposable-seed node loadtest/vehicle-db.test.js
      - run: npm ci && npm test && npm audit && npm run build
        working-directory: client
      - name: Initialize disposable Docker secrets
        run: python3 tools/init-docker-secrets.py
      - name: Build and start full stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Smoke test inside the game container
        run: docker compose exec -T game node --input-type=module < tools/docker-smoke.mjs
      - name: Check proxy
        run: curl --fail --retry 3 http://localhost:8080/health
      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 60 game redis proxy
      - name: Shut down disposable stack
        if: always()
        run: docker compose down
